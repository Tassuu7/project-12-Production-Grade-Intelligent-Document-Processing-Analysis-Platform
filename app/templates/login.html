<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Intelligent Document Processing Platform</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/auth.css">
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div style="display: flex; justify-content: center;">
                    <svg class="auth-logo" viewBox="0 0 24 24"><use href="/static/icons/icons.svg#icon-document"></use></svg>
                </div>
                <h1 style="font-size: 1.5rem; font-weight: 800; color: var(--slate-900);">Nexus DocIntel</h1>
                <p style="color: var(--slate-500); font-size: 0.9rem; margin-top: 0.35rem;">
                    Single Unified Portal for Users & Administrators
                </p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" id="tab-login">Sign In</button>
                <button type="button" class="auth-tab-btn" id="tab-register">Register Account</button>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-username">Username or Email</label>
                    <input type="text" id="login-username" class="form-control" placeholder="user@test.com or admin@test.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Sign In
                </button>
                <div style="margin-top: 1.5rem; background: var(--primary-50); border: 1px solid var(--primary-200); border-radius: var(--radius-sm); padding: 0.75rem; font-size: 0.8rem; color: var(--primary-900);">
                    <strong>Default Credentials:</strong><br>
                    • Admin: <code>admin@test.com</code> / <code>Admin@12345</code><br>
                    • User: <code>user@test.com</code> / <code>User@12345</code>
                </div>
            </form>

            <!-- Registration Form -->
            <form id="register-form" style="display: none;">
                <div class="form-group">
                    <label class="form-label" for="reg-fullname">Full Name</label>
                    <input type="text" id="reg-fullname" class="form-control" placeholder="Jane Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="jane@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-username">Username</label>
                    <input type="text" id="reg-username" class="form-control" placeholder="janedoe" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Minimum 8 characters" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
</body>
</html>
