<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus DocIntel - Enterprise Login</title>
    <link rel="stylesheet" href="/static/css/main.css">
    <link rel="stylesheet" href="/static/css/components.css">
    <link rel="stylesheet" href="/static/css/auth.css">
    <style>
        .brand-title-gradient {
            background: linear-gradient(135deg, #7f1d1d 0%, #dc2626 40%, #ea580c 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-size: 1.75rem;
            font-weight: 900;
            letter-spacing: -0.5px;
        }
        .quick-fill-btn {
            background: #ffffff;
            border: 1px solid #fed7aa;
            border-radius: 6px;
            padding: 6px 12px;
            font-size: 0.8rem;
            font-weight: 600;
            color: #c2410c;
            cursor: pointer;
            transition: all 0.2s;
            display: inline-block;
        }
        .quick-fill-btn:hover {
            background: #ea580c;
            color: #ffffff;
            border-color: #ea580c;
        }
    </style>
</head>
<body>
    <div class="auth-wrapper">
        <div class="auth-card">
            <div class="auth-header">
                <div style="display: flex; justify-content: center;">
                    <div class="auth-logo-badge">
                        <svg viewBox="0 0 24 24" style="width: 28px; height: 28px; fill: none; stroke: #ffffff; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round;">
                            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                            <polyline points="14 2 14 8 20 8"></polyline>
                            <line x1="16" y1="13" x2="8" y2="13"></line>
                            <line x1="16" y1="17" x2="8" y2="17"></line>
                        </svg>
                    </div>
                </div>
                <h1 class="brand-title-gradient">Nexus DocIntel</h1>
                <p style="color: var(--slate-600); font-size: 0.9rem; margin-top: 0.35rem; font-weight: 500;">
                    Single Unified Portal for Users & Administrators
                </p>
            </div>

            <div class="auth-tabs">
                <button type="button" class="auth-tab-btn active" id="tab-login">Sign In</button>
                <button type="button" class="auth-tab-btn" id="tab-register">Register Account</button>
            </div>

            <!-- Login Form -->
            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="login-username">Username or Email</label>
                    <input type="text" id="login-username" class="form-control" placeholder="user@test.com or admin@test.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="login-password">Password</label>
                    <input type="password" id="login-password" class="form-control" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Sign In
                </button>
                <div style="margin-top: 1.25rem; background: #fff7ed; border: 1px solid #fed7aa; border-radius: var(--radius-sm); padding: 0.85rem; font-size: 0.82rem; color: #9a3412;">
                    <strong>Auto-Fill Test Credentials:</strong>
                    <div style="display: flex; gap: 0.5rem; margin-top: 0.5rem;">
                        <button type="button" class="quick-fill-btn" onclick="fillCreds('admin@test.com', 'Admin@12345')">Admin Account</button>
                        <button type="button" class="quick-fill-btn" onclick="fillCreds('user@test.com', 'User@12345')">User Account</button>
                    </div>
                </div>
            </form>

            <!-- Registration Form -->
            <form id="register-form" style="display: none;">
                <div class="form-group">
                    <label class="form-label" for="reg-fullname">Full Name</label>
                    <input type="text" id="reg-fullname" class="form-control" placeholder="Jane Doe" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-email">Email Address</label>
                    <input type="email" id="reg-email" class="form-control" placeholder="jane@example.com" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-username">Username</label>
                    <input type="text" id="reg-username" class="form-control" placeholder="janedoe" required>
                </div>
                <div class="form-group">
                    <label class="form-label" for="reg-password">Password</label>
                    <input type="password" id="reg-password" class="form-control" placeholder="Minimum 8 characters" minlength="8" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">
                    Create Account
                </button>
            </form>
        </div>
    </div>

    <div id="toast-container"></div>
    <script src="/static/js/app.js"></script>
    <script src="/static/js/auth.js"></script>
    <script>
    function fillCreds(u, p) {
        document.getElementById('login-username').value = u;
        document.getElementById('login-password').value = p;
    }
    </script>
</body>
</html>
