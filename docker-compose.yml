version: '3.8'

services:
  docintel:
    build: .
    container_name: nexus_docintel_service
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Nexus DocIntel Enterprise
      - APP_ENV=production
      - DEBUG=false
      - HOST=0.0.0.0
      - PORT=8000
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    restart: unless-stopped
